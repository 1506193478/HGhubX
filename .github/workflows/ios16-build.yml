name: iOS16 unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios16-build.yml
      - ios16-playback-fix.patch
      - BUILD.md
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ios16-build
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Apply the iOS 16 playback fix in the CI workspace
        run: |
          set -euo pipefail
          git apply --check --verbose ios16-playback-fix.patch
          git apply --verbose ios16-playback-fix.patch
          grep -q 'isIos || isLinux' src/api.ts
          grep -q 'NSAllowsLocalNetworking' src-tauri/Info.ios.plist
          grep -q 'target_os = "ios"' src-tauri/src/media.rs
          git status --short

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios16
      - run: pnpm install --frozen-lockfile

      - name: Generate iOS project (orientations + local-network ATS only)
        run: |
          set -euo pipefail
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          done

      - name: Build and package unsigned IPA
        env:
          APP_VERSION: ios16-r${{ github.run_number }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ios16-unsigned-ipa
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
